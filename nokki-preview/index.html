<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#08060e">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Shadow Companion Preview · Nokki Line</title>
  <meta name="description" content="Mobile 3D preview of the Nokki evolution line — original creature companions in three stages.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #05040a;
      --void-2: #0c0a14;
      --violet: #5c3d8f;
      --violet-glow: #7b5cb8;
      --moon: #c8d4e8;
      --moon-dim: #8a96ab;
      --silver: #e4e8f0;
      --border: rgba(200, 212, 232, 0.12);
      --tap: rgba(124, 92, 184, 0.35);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--void);
      color: var(--silver);
      font-family: Outfit, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "head"
        "stage"
        "dock";
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      grid-area: head;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 8px;
      background: linear-gradient(180deg, rgba(5, 4, 10, 0.92) 0%, transparent 100%);
      z-index: 4;
      pointer-events: none;
    }
    header > * { pointer-events: auto; }
    .title-wrap { min-width: 0; }
    h1 {
      margin: 0;
      font-family: Oxanium, sans-serif;
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--moon);
    }
    .subtitle {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--moon-dim);
      letter-spacing: 0.04em;
    }
    .back {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--moon-dim);
      text-decoration: none;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(12, 10, 20, 0.75);
    }
    .stage-wrap {
      grid-area: stage;
      position: relative;
      min-height: 0;
    }
    #canvas-host {
      position: absolute;
      inset: 0;
      touch-action: none;
    }
    #canvas-host canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(ellipse at 50% 40%, rgba(92, 61, 143, 0.15), var(--void) 65%);
      z-index: 3;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loading p {
      margin: 0;
      font-size: 14px;
      color: var(--moon);
      text-align: center;
      padding: 0 24px;
      max-width: 280px;
      line-height: 1.45;
    }
    .loading .hint {
      font-size: 12px;
      color: var(--moon-dim);
    }
    .bar-track {
      width: min(220px, 70vw);
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--violet), var(--moon));
      transition: width 0.15s ease;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(200, 212, 232, 0.15);
      border-top-color: var(--violet-glow);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dock {
      grid-area: dock;
      z-index: 4;
      padding: 10px 12px 14px;
      background: linear-gradient(0deg, rgba(5, 4, 10, 0.95) 0%, transparent 100%);
    }
    .stages {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .stage-btn {
      font-family: Oxanium, sans-serif;
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      min-height: 52px;
      padding: 12px 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(12, 10, 20, 0.85);
      color: var(--moon-dim);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .stage-btn:active {
      transform: scale(0.98);
    }
    .stage-btn[aria-pressed="true"] {
      color: var(--silver);
      border-color: var(--violet-glow);
      background: linear-gradient(160deg, rgba(92, 61, 143, 0.45), rgba(12, 10, 20, 0.9));
      box-shadow: 0 0 20px rgba(123, 92, 184, 0.25);
    }
    .lights-label {
      margin: 0 0 6px;
      font-family: Oxanium, sans-serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--moon-dim);
    }
    .lights {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .light-btn {
      font-family: Outfit, sans-serif;
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 600;
      min-height: 46px;
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(12, 10, 20, 0.8);
      color: var(--moon-dim);
      cursor: pointer;
    }
    .light-btn[aria-pressed="true"],
    .light-btn.is-active {
      color: var(--silver);
      border-color: var(--violet-glow);
      background: linear-gradient(160deg, rgba(92, 61, 143, 0.35), rgba(12, 10, 20, 0.92));
    }
    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tool-btn {
      font-family: Outfit, sans-serif;
      font-size: 14px;
      font-weight: 600;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(12, 10, 20, 0.75);
      color: var(--moon);
      cursor: pointer;
    }
    .tool-btn[aria-pressed="true"] {
      border-color: rgba(200, 212, 232, 0.35);
      background: rgba(200, 212, 232, 0.08);
    }
    .gesture-hint {
      margin: 8px 0 0;
      text-align: center;
      font-size: 11px;
      color: var(--moon-dim);
      letter-spacing: 0.03em;
    }
    .err {
      color: #e8a0a8;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header>
      <div class="title-wrap">
        <h1>Nokki Line</h1>
        <p class="subtitle">Shadow companion preview · stages 1–3</p>
      </div>
      <a class="back" href="../">Exit</a>
    </header>

    <div class="stage-wrap">
      <div id="canvas-host" aria-label="3D model viewport"></div>
      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="load-msg">Summoning companion…</p>
        <div class="bar-track" aria-hidden="true"><div id="load-bar" class="bar-fill"></div></div>
        <p id="load-hint" class="hint"></p>
      </div>
    </div>

    <footer class="dock">
      <div class="stages" role="group" aria-label="Evolution stage">
        <button type="button" class="stage-btn" data-stage="nokki" aria-pressed="true">Nokki</button>
        <button type="button" class="stage-btn" data-stage="nokkane" aria-pressed="false">Nokkane</button>
        <button type="button" class="stage-btn" data-stage="nokkara" aria-pressed="false">Nokkara</button>
      </div>
      <p class="lights-label">Lighting</p>
      <div class="lights" role="group" aria-label="Lighting preset">
        <button type="button" class="light-btn" data-light="studio">Studio · bright</button>
        <button type="button" class="light-btn" data-light="moonlit">Moonlit · void</button>
        <button type="button" class="light-btn" data-light="violet">Violet · awakened</button>
        <button type="button" class="light-btn" data-light="warm">Soft · indoor</button>
      </div>
      <div class="tools">
        <button type="button" id="btn-rotate" class="tool-btn" aria-pressed="true">Auto-rotate · On</button>
        <button type="button" id="btn-reset" class="tool-btn" aria-pressed="false">Reset view</button>
      </div>
      <p class="gesture-hint">Drag to orbit · pinch to zoom · two-finger pan</p>
    </footer>
  </div>

  <script type="module" src="./viewer.mjs?v=5"></script>
</body>
</html>
